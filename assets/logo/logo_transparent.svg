<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Outer Badge Frame Transparent -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#9E2A2B" stroke-width="10"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Curved Text Top: THE BUTCHER'S -->
  <path id="textArcTopTrans" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" />
  <text font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="currentColor" letter-spacing="4">
    <textPath href="#textArcTopTrans" startOffset="50%" text-anchor="middle">
      THE BUTCHER'S
    </textPath>
  </text>

  <!-- Central Bull Silhouette -->
  <g transform="translate(145, 120) scale(0.85)">
    <path d="M 10 155 Q 125 150 240 155 L 245 160 L 5 160 Z" fill="currentColor"/>
    <path d="M 40 150 C 35 140 38 115 45 105 C 50 95 60 90 70 85 C 75 70 85 50 100 45 C 108 42 115 48 120 55 C 135 52 160 50 180 58 C 190 62 195 72 205 80 C 215 88 225 92 230 105 C 233 115 228 125 225 140 C 223 150 218 153 212 153 L 202 110 C 198 108 192 112 190 120 L 185 152 L 172 152 L 175 118 L 165 118 L 155 152 L 140 152 L 142 120 L 130 120 L 120 152 C 110 152 90 152 75 152 C 70 140 68 130 65 125 L 55 152 Z" fill="currentColor"/>
    <path d="M 45 105 C 38 95 30 90 22 92 C 28 82 40 85 50 90 Z" fill="currentColor"/>
    <path d="M 52 95 C 48 80 40 70 32 65 C 40 65 48 75 56 85 Z" fill="currentColor"/>
  </g>

  <!-- Middle Banner Ribbon -->
  <path d="M 40,240 Q 250,225 460,240 L 470,290 Q 250,305 30,290 Z" fill="#9E2A2B" />

  <!-- Banner Text: MEAT HOUSE -->
  <text x="250" y="278" font-family="'Outfit', 'Cinzel', serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">
    MEAT HOUSE
  </text>

  <!-- Bottom Crossed Cleavers Graphic -->
  <g transform="translate(200, 315) scale(0.55)">
    <g transform="rotate(-30 90 90)">
      <rect x="75" y="10" width="30" height="100" rx="5" fill="currentColor"/>
      <path d="M 20 100 L 130 100 L 130 160 C 130 185 80 185 20 160 Z" fill="currentColor"/>
    </g>
    <g transform="rotate(30 90 90)">
      <rect x="75" y="10" width="30" height="100" rx="5" fill="currentColor"/>
      <path d="M 20 100 L 130 100 L 130 160 C 130 185 80 185 20 160 Z" fill="currentColor"/>
    </g>
  </g>
</svg>
